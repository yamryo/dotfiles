# ~/.config/tmux/.tmux.conf
# tmux 3.7c / macOS

##### General

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 100000
set -g mouse on
set -s copy-command 'pbcopy'
set -g escape-time 10
set -g focus-events on
  
set -g @config-file "$HOME/.config/tmux/tmux.conf"
set -g @tpm-path '~/.config/tmux/plugins/tpm/tpm'

##### Prefix

unbind C-b
set -g prefix C-u
bind C-u send-prefix

##### Reload config

bind -N "Reload tmux config" r source-file "#{@config-file}"; display-message "tmux config reloaded"

##### Splits

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

##### New window in current directory

bind -N "Create new window" c new-window -c "#{pane_current_path}"

##### Pane navigation

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### Pane resize

bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

##### Copy mode

setw -g mode-keys vi

bind [ copy-mode
bind ] paste-buffer

##### Status bar

set -g status on
set -g status-position top  #bottom
set -g status-interval 5

set -g status-style "bg=#1f2335,fg=#a9b1d6"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#7aa2f7,bold] #S #[default]"

set -g status-right \
"#[fg=#9ece6a]#(whoami) \
#[fg=#565f89]│ \
#[fg=#e0af68]%Y-%m-%d \
#[fg=#565f89]│ \
#[fg=#7aa2f7]%H:%M "

##### Window list

setw -g window-status-format \
" #[fg=#9aa5ce]#I:#W "

setw -g window-status-current-format \
" #[bg=#3b4261,fg=#ffffff,bold] #I:#W #[default]"

setw -g window-status-separator ""

##### Pane borders

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

##### Messages

set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#e0af68"

##### fzf key bindings help

bind ? display-popup \
  -w 90% \
  -h 80% \
  -E "tmux list-keys -N | fzf"

##### Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run "#{@tpm-path}"
