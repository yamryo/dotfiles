#
# .tmux.conf
#
# Time-stamp: <2024-02-08 17:45:38 (ryosuke)>
#
#-----------------------------------------------
# prefix キー
#-----------------------------------------------
set -g prefix C-u
bind C-u send-prefix
unbind C-b
#-----------------------------------------------

#-----------------------------------------------
# 基本設定
#-----------------------------------------------
# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
#set -g base-index 1
# ペインのインデックスを1から始める
#setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-option -g allow-rename off

# Tmux が使うシェルの指定
set-option -g default-shell /usr/bin/zsh

# マウス操作を有効にする
set -g mouse on
set -s copy-command 'wl-copy'
#set-option -g mode-mouse on
#set-option -g mouse-select-pane on
#set-option -g mouse-select-window on
#set-option -g mouse-resize-pane on
# for version > 2.1
#setw -g mouse
#bind-key -n WheelUpPane select-pane -t= \; copy-mode -e\; send-keys -M
#bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# コピーモードを設定する
## viのキーバインドを使用する
#setw -g mode-keys vi
## コピーモードの操作をvi風に設定する
#bind-key -t vi-copy v begin-selection
#bind-key -t vi-copy y copy-pipe "reattach-to-user-namespace pbcopy"
#unbind -t vi-copy Enter
#bind-key -t vi-copy Enter copy-pipe "reattach-to-user-namespace pbcopy"
## クリップボード共有を有効にする
#if-shell "which xsel" '\
#  bind-key -t vi-copy y copy-pipe "xsel -ib"; \
#  bind-key -t vi-copy Enter copy-pipe "xsel -ib"; \
#'
#-----------------------------------------------

#-----------------------------------------------
# ペイン関連
#-----------------------------------------------
bind c new-window -c "#{pane_current_path}"
# |- でペインを縦横に分割する
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
#-----------------------------------------------

# ----------------------------------------
# Appearance: Tokyo Night
# ----------------------------------------
# True Color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Status bar
set -g status-position top
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-justify centre

# Windows
set -g window-status-style "fg=#9aa5ce,bg=#1f2335"
set -g window-status-current-style "fg=#ffffff,bg=#3b4261,bold"

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#292e42,fg=#c0caf5"

# Status left
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold]#S #[default]"

# Status right
set -g status-right-length 80
set -g status-right "#[fg=#9ece6a]#(whoami) #[fg=#e0af68]%Y-%m-%d #[fg=#7aa2f7]%H:%M"
#-----------------------------------------------

#-----------------------------------------------
# プラグイン
#-----------------------------------------------
# continuum
set -g @continuum-restore 'on'
# resurrect
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'ssh btm btop'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
#-----------------------------------------------
